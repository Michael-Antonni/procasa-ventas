name: Supabase migrations

# Aplica supabase/migrations/*.sql a la base de datos remota de Supabase.
# Corre en cada push a main que toque las migraciones, y tambien a mano
# desde la pestana Actions (boton "Run workflow").

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar migraciones
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar la CLI de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enlazar el proyecto remoto
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Ver que migraciones faltan
        run: supabase migration list --linked

      - name: Aplicar migraciones
        run: supabase db push --linked --include-all
